#:schema https://raw.githubusercontent.com/openai/codex/refs/heads/main/codex-rs/core/config.schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
review_model = "gpt-5.6-sol"
plan_mode_reasoning_effort = "high"
web_search = "live"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "auto_review"
service_tier = "fast"
# suppress_unstable_features_warning = true

[features]
apps = false
browser_use = false
browser_use_external = false
chronicle = false
collaboration_modes = false
computer_use = false
default_mode_request_user_input = true
fast_mode = true
multi_agent = true
multi_agent_v2 = false
multi_agent_mode = true
hooks = true
in_app_browser = false
image_generation = true
imagegenext = true
memories = false
memory_tool = false
plugin_sharing = false
plugins = false
remote_compaction_v2 = false
skill_mcp_dependency_install = false
tool_call_mcp_elicitation = false
tool_suggest = false
js_repl = false
js_repl_tools_only = false
enable_mcp_apps = false
sqlite = false


[memories]
generate_memories = false
use_memories = false
disable_on_external_context = true

[[skills.config]]
path = "./skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "./skills/.system/skill-creator/SKILL.md"
enabled = false

[tui]
status_line = [
    "model-with-reasoning",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true

[agents]
enabled = true
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 8

[model_providers.local]
name = "local"
base_url = "http://localhost:11434/v1"
wire_api = "responses"
stream_idle_timeout_ms = 10000000

[model_providers.proxy]
name = "vibe proxy api"
base_url = "http://localhost:8317/v1"
wire_api = "responses"
stream_idle_timeout_ms = 10000000

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
command = 'python3 "${CODEX_HOME:-$HOME/.codex}/hooks/rtk_pre_tool_use.py"'
timeout = 30
type = "command"
statusMessage = "Routing noisy Bash command through RTK"

[apps.connector_76869538009648d5b282a4bb21c3d157]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."build-ios-apps@openai-curated"]
enabled = false

[plugins."build-macos-apps@openai-curated"]
enabled = false
