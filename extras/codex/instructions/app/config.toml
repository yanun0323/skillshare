#:schema https://raw.githubusercontent.com/openai/codex/refs/heads/main/codex-rs/core/config.schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
review_model = "gpt-5.6-sol"
plan_mode_reasoning_effort = "high"
web_search = "live"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "auto_review"
service_tier = "fast"
suppress_unstable_features_warning = false

[features]
apps = true
computer_use = true
collaboration_modes = false
default_mode_request_user_input = true
fast_mode = true
multi_agent = true
multi_agent_v2 = false
multi_agent_mode = true
hooks = true
image_generation = true
memories = true
sqlite = false


[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

[tui]
status_line = [
    "model-with-reasoning",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true

[agents]
enabled = true
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 8

[model_providers.local]
name = "local"
base_url = "http://localhost:11434/v1"
wire_api = "responses"
stream_idle_timeout_ms = 10000000

[model_providers.proxy]
name = "vibe proxy api"
base_url = "http://localhost:8317/v1"
wire_api = "responses"
stream_idle_timeout_ms = 10000000

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
command = 'python3 "${CODEX_HOME:-$HOME/.codex}/hooks/rtk_pre_tool_use.py"'
timeout = 30
type = "command"
statusMessage = "Routing noisy Bash command through RTK"

[apps.connector_76869538009648d5b282a4bb21c3d157]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true