# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
sources:
  skills: ~/.config/skillshare/skills
  agents: ~/.config/skillshare/agents
git_root: root
mode: merge
targets:
  claude:
    skills:
      path: ~/.claude/skills
  codex:
    skills:
      path: ~/.codex-cli/skills
  pi:
    skills:
      path: ~/.pi/agent/skills
extras:
  - name: instructions
    source: ~/.config/skillshare/extra/all/instructions
    targets:
      - path: ~/.codex-cli
        mode: merge
      - path: ~/.claude
        mode: merge
  - name: hooks
    source: ~/.config/skillshare/extra/all/hook
    targets:
      - path: ~/.codex-cli/hooks
        mode: merge
      - path: ~/.claude/hooks
        mode: merge
  - name: claude-instructions
    source: ~/.config/skillshare/extra/claude/instructions
    targets:
      - path: ~/.claude
        mode: merge
  - name: claude-agents
    source: ~/.config/skillshare/extra/claude/agents
    targets:
      - path: ~/.claude/agents
        mode: merge
  - name: codex-instructions
    source: ~/.config/skillshare/extra/codex/instructions
    targets:
      - path: ~/.codex-cli
        mode: merge
  - name: codex-agents
    source: ~/.config/skillshare/extra/codex/agents
    targets:
      - path: ~/.codex-cli/agents
        mode: merge
  - name: pi-prompts
    source: ~/.config/skillshare/extra/pi/prompts
    targets:
      - path: ~/.pi/agent/prompts
        mode: merge
ignore:
  - .DS_Store
  - .git/
  - __pycache__/
audit:
  block_threshold: CRITICAL
